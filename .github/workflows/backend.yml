name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Login no Docker Hub  # 👈 movido para antes do build
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build with Maven
      run: |
        cd domus
        mvn clean package -DskipTests

    - name: Build Docker Image
      run: |
        cd domus
        docker build -t ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

    - name: Deploy na EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Parando container antigo..."
          docker stop domus-backend || true
          docker rm domus-backend || true

          echo "Removendo imagem antiga..."
          docker rmi ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest || true

          echo "Baixando nova imagem..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

          echo "Subindo novo container..."
          docker run -d \
            --restart always \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e JWT_EXPIRATION=3600000 \
            -e APP_DEMO_PASSWORD=${{ secrets.APP_DEMO_PASSWORD }} \
            -e APP_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }} \
            -e APP_ADMIN_LOGIN=${{ secrets.APP_ADMIN_LOGIN }} \
            --name domus-backend \
            ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

          echo "Containers ativos:"
          docker ps
