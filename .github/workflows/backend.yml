name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: |
        cd domus
        mvn clean package -DskipTests

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest .

    - name: Login no Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

    - name: Deploy na EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop domus-backend || true
          docker rm domus-backend || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest
          docker run -d -p 8080:8080 --name domus-backend ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest
