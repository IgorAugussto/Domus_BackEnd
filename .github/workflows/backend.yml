name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: |
          cd domus
          mvn clean verify

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./domus
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Parando container antigo..."
            docker stop domus-backend || true
            docker rm domus-backend || true

            echo "Removendo imagem antiga..."
            docker rmi ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest || true

            echo "Baixando nova imagem..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

            echo "Subindo novo container..."
            docker run -d \
              --restart always \
              -p 8443:8443 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_EXPIRATION=3600000 \
              --name domus-backend \
              ${{ secrets.DOCKER_USERNAME }}/domus-backend:latest

            echo "Containers ativos:"
            docker ps
