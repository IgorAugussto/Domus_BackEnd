spring:
  datasource:
    url: jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.svxdmuthiycwgqgxpwyn
    password: ${SUPABASE_DB_PASSWORD}

  ssl:
    bundle:
      jks:
        web-server:
          keystore:
            location: file:/keystore/keystore.p12
            password: ${SSL_KEYSTORE_PASSWORD}
            type: PKCS12

  flyway:
    clean-disabled: true  # NUNCA apaga dados em produção

  # ── RabbitMQ (produção — EC2) ────────────────────────────────────────────────
  # Em produção o RabbitMQ roda na mesma instância EC2 que o Java e o Python.
  # Instale via: sudo apt install rabbitmq-server && sudo systemctl enable rabbitmq-server
  # Variáveis obrigatórias em produção (definir como env vars na EC2 ou no script de deploy):
  #   RABBITMQ_HOST     → "localhost" se no mesmo servidor (recomendado), ou IP externo
  #   RABBITMQ_USERNAME → usuário criado no RabbitMQ (não usar "guest" em prod!")
  #   RABBITMQ_PASSWORD → senha forte
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

server:
  port: 8443
  ssl:
    bundle: web-server

app:
  demo-mode: true
  cookie:
    secure: true