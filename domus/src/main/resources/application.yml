spring:
  application:
    name: domus

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway é o dono do schema — Hibernate só valida
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true  # trata banco existente como já na versão 1
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    org.hibernate: DEBUG
    org.hibernate.type: TRACE

app:
  demo-mode: true
  users:
    demo:
      name: Conta Demo
      email: demo@domus.app
      password: ${APP_DEMO_PASSWORD}
    admin:
      name: Igor Augusto
      email: ${APP_ADMIN_LOGIN}
      password: ${APP_ADMIN_PASSWORD}

statement:
  service:
    url: ${STATEMENT_SERVICE_URL:http://localhost:5000}
