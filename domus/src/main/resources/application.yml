spring:
  application:
    name: domus

  jpa:
    hibernate:
      ddl-auto: update   # em prod pode mudar para validate depois
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}   # fallback de 1 hora se não tiver variável

logging:
  level:
    org.hibernate: DEBUG
    org.hibernate.type: TRACE