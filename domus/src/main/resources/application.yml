spring:
  application:
    name: domus

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  # Valores padrão para rodar localmente sem Docker (rabbitmq instalado na máquina).
  # Em Docker: RABBITMQ_HOST=rabbitmq (nome do serviço no docker-compose).
  # Em produção (EC2): RABBITMQ_HOST=localhost (Rabbit instalado no mesmo servidor).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway é o dono do schema — Hibernate só valida
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true  # trata banco existente como já na versão 1
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    org.hibernate: DEBUG
    org.hibernate.type: TRACE

app:
  demo-mode: true
  users:
    demo:
      name: Conta Demo
      email: demo@domus.app
      password: ${APP_DEMO_PASSWORD}
    admin:
      name: Igor Augusto
      email: ${APP_ADMIN_LOGIN}
      password: ${APP_ADMIN_PASSWORD}

statement:
  service:
    url: ${STATEMENT_SERVICE_URL:http://localhost:5000}
